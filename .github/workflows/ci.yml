name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The dev image is Go plus libvips built from source. The libvips layer is
      # cached, so only the first run pays for the compile.
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: flatpix-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      - name: gofmt
        run: docker run --rm -v "$PWD":/src -w /src flatpix-dev sh -c 'test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)'

      - name: go vet
        run: docker run --rm -v "$PWD":/src -w /src flatpix-dev go vet ./...

      - name: Unit and integration tests (race detector)
        run: docker run --rm -v "$PWD":/src -w /src flatpix-dev go test -race -count=1 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@v3

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/taktekhq/flatpix
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: flatpix:ci
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=image,mode=max

      - name: Smoke test the image
        run: scripts/smoke.sh flatpix:ci

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: |
            type=gha,scope=dev
            type=gha,scope=image
